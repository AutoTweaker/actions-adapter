name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "actions-adapter $GITHUB_REF_NAME" \
            --generate-notes \
            build/libs/*.jar
        env:
          GH_TOKEN: ${{ github.token }}

  update-latest:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JAR=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[0].name')
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "jar_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${JAR}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update latest.json to ${VERSION}"
            git push origin main
          fi
